services:
  - type: web
    name: factorypulse-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://factorypulse-hub.vercel.app,http://localhost:3001
      - key: SUPABASE_URL
        fromSecret: SUPABASE_URL
      - key: SUPABASE_KEY
        fromSecret: SUPABASE_KEY
      - key: GEMINI_API_KEY
        fromSecret: GEMINI_API_KEY
      - key: LLM_PROVIDER
        value: gemini
      - key: RESEND_API_KEY
        fromSecret: RESEND_API_KEY
      - key: EMAIL_FROM
        value: alerts@factorypulse.ai
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_DAYS
        value: "7"
      - key: SCHEDULER_CHECK_HOURS
        value: "6"
